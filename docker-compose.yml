# Jalankan: docker compose up -d
#
#   platform-db : database internal platform        -> localhost:5432
#   target-toko : database target contoh (toko)     -> localhost:5433
#   target-kampus: database target contoh (kampus)  -> localhost:5434
#   test-db     : database untuk integration test  -> localhost:55432 (tmpfs, selalu bersih)
#   app         : aplikasi (opsional: docker compose --profile app up)
#
# Dari dalam container app, host database target adalah nama service
# (target-toko / target-kampus) port 5432. Dari laptop: localhost:5433/5434.
services:
  platform-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: dbplatform
    ports: ["5432:5432"]
    volumes: [platform-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d dbplatform"]
      interval: 2s
      retries: 30

  target-toko:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: toko_owner
      POSTGRES_PASSWORD: toko_pass
      POSTGRES_DB: toko
    ports: ["5433:5432"]
    volumes:
      - ./deploy/sample/toko.sql:/docker-entrypoint-initdb.d/01-toko.sql:ro
      - toko-data:/var/lib/postgresql/data

  target-kampus:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kampus_owner
      POSTGRES_PASSWORD: kampus_pass
      POSTGRES_DB: kampus
    ports: ["5434:5432"]
    volumes:
      - ./deploy/sample/kampus.sql:/docker-entrypoint-initdb.d/01-kampus.sql:ro
      - kampus-data:/var/lib/postgresql/data

  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  target-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: mysql_root_pass
      MYSQL_DATABASE: kampus
      MYSQL_USER: platform_app
      MYSQL_PASSWORD: platform_app_pass
    ports: ["3306:3306"]
    volumes:
      - ./deploy/sample/kampus_mysql.sql:/docker-entrypoint-initdb.d/01-kampus.sql:ro
      - mysql-data:/var/lib/mysql

  app:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://platform:platform@platform-db:5432/dbplatform?sslmode=disable
    ports: ["8080:8080"]
    depends_on:
      platform-db: { condition: service_healthy }

  # Observability Stack (Profile: obs)
  # Jalankan: docker compose --profile obs up -d
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    profiles: ["obs"]
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./deploy/observability/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.60
    profiles: ["obs"]
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["obs"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090" # Web UI
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["obs"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./deploy/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./deploy/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/json
    ports:
      - "3000:3000" # Web UI
    depends_on:
      - prometheus
      - jaeger

volumes:
  platform-data:
  toko-data:
  kampus-data:
  mysql-data: