# OpenTelemetry Collector: menerima trace dan log dari aplikasi lewat OTLP,
# lalu meneruskan trace ke Jaeger dan log ke Loki.
# Aplikasi mengirim dengan OTEL_TRACES_EXPORTER=otlp dan OTEL_LOGS_EXPORTER=otlp.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Loki 3.x menerima OTLP langsung; atribut log (trace_id, job_id, actor,
  # ...) disimpan sebagai structured metadata, service.name menjadi label
  # service_name.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, debug]
