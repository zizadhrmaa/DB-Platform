name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # -p 1: paket test berbagi satu database PostgreSQL, sedangkan advisory
      # lock eksekusi migration berlaku per database (bukan per schema),
      # jadi paket yang berjalan paralel saling berebut lock fixture db_id
      # yang sama. Test di dalam satu paket tetap terisolasi per schema.
      - run: go test -p 1 -count=1 -race ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/postgres?sslmode=disable