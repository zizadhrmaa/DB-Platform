{{/* .Data: userForm */}}
{{define "content"}}
{{template "admin-nav"}}
<section class="card narrow">
  <h1>Tambah user</h1>
  <form method="post" action="/admin/users" novalidate>
    {{template "csrf" .}}
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="off" required
             aria-describedby="username-hint" value="{{.Data.Username}}">
      <p id="username-hint" class="hint">3 sampai 64 karakter: huruf, angka, titik, garis bawah, atau tanda minus.</p>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required
             aria-describedby="password-hint">
      <p id="password-hint" class="hint">Minimal 8 karakter.</p>
    </div>
    <div class="check">
      <input id="is_admin" name="is_admin" type="checkbox" {{if .Data.IsAdmin}}checked{{end}}>
      <label for="is_admin">Jadikan Platform Admin</label>
    </div>
    <button type="submit">Simpan</button>
  </form>
</section>
{{end}}
